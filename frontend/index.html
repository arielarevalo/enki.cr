<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enki — AI Engineering</title>
  <meta name="description" content="Building what comes next. Infrastructure and intelligence for products that reason." />
  <meta name="theme-color" content="#0A0A0A" />
  <meta property="og:title" content="Enki — AI Engineering" />
  <meta property="og:description" content="Building what comes next." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://enki.cr/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M20.2 34.1 A12 12 0 1 1 43.8 34.1' transform='rotate(0 32 32)'/%3E%3Cpath d='M14.3 35.1 A18 18 0 1 1 49.7 35.1' transform='rotate(120 32 32)'/%3E%3Cpath d='M6.4 36.5 A26 26 0 1 1 57.6 36.5' transform='rotate(240 32 32)'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0A0A0A;
      --bg-surface: #111111;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --text: #F0F0F0;
      --text-muted: rgba(255,255,255,0.44);
      --text-dim: rgba(255,255,255,0.24);
      --glow: rgba(120, 200, 160, 0.15);
      --accent: #FFFFFF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body { min-height: 100vh; }

    a { color: inherit; text-decoration: none; }

    :focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 4px;
    }

    .skip {
      position: absolute;
      left: -9999px;
      z-index: 100;
    }
    .skip:focus {
      left: 1rem;
      top: 1rem;
      background: var(--text);
      color: var(--bg);
      padding: 0.5rem 1rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.875rem;
    }

    .container {
      max-width: 1200px;
      margin-inline: auto;
      padding-inline: 2rem;
    }

    /* ─── Header ─── */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(10, 10, 10, 0.8);
      border-bottom: 1px solid var(--border);
    }

    .header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-block: 1rem;
      overflow: hidden;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand__logo {
      width: 28px;
      height: 28px;
    }

    .brand__text {
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .header .btn {
      padding: 0.5rem 1.25rem;
      font-size: 0.7rem;
      flex-shrink: 1;
      min-width: 0;
    }

    /* ─── Hero ─── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero__bg {
      position: absolute;
      inset: 0;
      mix-blend-mode: lighten;
      pointer-events: none;
    }

    .hero__bg svg {
      width: 100%;
      height: 100%;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 60% 40%, rgba(120,200,160,0.22) 0%, rgba(120,200,160,0.08) 25%, transparent 55%),
        radial-gradient(circle at 60% 40%, rgba(255,255,255,0.08) 0%, transparent 18%);
      pointer-events: none;
      z-index: 1;
    }

    .hero__content {
      position: relative;
      z-index: 2;
      margin-left: 3rem;
    }

    .kicker {
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 1rem;
      color: var(--text-dim);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-weight: 700;
      font-size: clamp(3.97rem, 7.94vw + 1.32rem, 7.27rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      max-width: 14ch;
    }

    .subtitle {
      font-weight: 400;
      font-size: clamp(1.455rem, 0.66vw + 1.32rem, 1.78rem);
      color: var(--text-muted);
      max-width: 48ch;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 2rem;
      background: var(--accent);
      color: var(--bg);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: opacity 200ms;
    }
    .btn:hover { opacity: 0.9; }

    /* ─── Contact ─── */
    .contact {
      position: relative;
      padding: 8rem 0;
      text-align: center;
      overflow: hidden;
    }

    .contact__bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .contact__bg svg {
      width: 600px;
      height: 600px;
      animation: rotate-slow 60s linear infinite;
    }

    .contact__content {
      position: relative;
      z-index: 1;
    }

    .contact h2 {
      font-weight: 700;
      font-size: clamp(2.5rem, 5vw + 1rem, 4.5rem);
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .contact__location {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .contact__email {
      font-family: 'Space Mono', monospace;
      font-size: 1.25rem;
      color: var(--text);
      position: relative;
      display: inline-block;
    }
    .contact__email::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--text);
      transition: width 300ms;
    }
    .contact__email:hover::after {
      width: 100%;
    }

    /* ─── Footer ─── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 0;
    }

    .footer__inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer small {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* ─── Animations ─── */
    @keyframes pulse {
      0%, 100% { opacity: var(--base-opacity, 0.1); }
      50% { opacity: calc(var(--base-opacity, 0.1) * 2.5); }
    }

    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .ray-pulse {
      animation: pulse var(--pulse-duration, 5s) ease-in-out infinite;
      animation-delay: var(--pulse-delay, 0s);
    }

    /* ─── Responsive ─── */
    @media (max-width: 768px) {
      .hero__content {
        padding-bottom: 10vh;
      }
      h1 { max-width: 100%; }
      .header .btn {
        padding: 0.4rem 1rem;
        font-size: 0.65rem;
      }
      .contact__bg svg {
        width: 400px;
        height: 400px;
      }
      .footer__inner {
        flex-direction: column;
        gap: 0.5rem;
        text-align: center;
      }
    }
    @media (max-width: 420px) {
      .container { padding-inline: 1.25rem; }
      .header .btn { padding: 0.35rem 0.75rem; font-size: 0.6rem; }
    }

    /* ─── Reduced Motion ─── */
    @media (prefers-reduced-motion: reduce) {
      .ray-pulse { animation: none; }
      .contact__bg svg { animation: none; }
      .contact__email::after {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header>
    <div class="container header__inner">
      <a class="brand" href="/" aria-label="Enki home">
        <svg class="brand__logo" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M20.2 34.1 A12 12 0 1 1 43.8 34.1" transform="rotate(0 32 32)"/>
          <path d="M14.3 35.1 A18 18 0 1 1 49.7 35.1" transform="rotate(120 32 32)"/>
          <path d="M6.4 36.5 A26 26 0 1 1 57.6 36.5" transform="rotate(240 32 32)"/>
        </svg>
        <span class="brand__text">Enki</span>
      </a>
      <a class="btn" href="mailto:info@enki.cr">Get in touch</a>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="hero__bg" id="hero-bg"></div>
      <div class="container hero__content">
        <div class="kicker">AI Engineering</div>
        <h1>Building what comes next.</h1>
        <p class="subtitle">Infrastructure and intelligence for products that reason.</p>
      </div>
    </section>

    <section class="contact">
      <div class="contact__bg" id="contact-bg"></div>
      <div class="container contact__content">
        <h2>Let's build.</h2>
        <p class="contact__location">San Jos&eacute;, Costa Rica</p>
        <a class="contact__email" href="mailto:info@enki.cr">info@enki.cr</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer__inner">
      <small>&copy; <span id="year"></span> Enki S.R.L.</small>
      <small>All rights reserved.</small>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    /* Seeded PRNG (mulberry32) for deterministic ray generation */
    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    /* Hero: Radiant Emergence */
    (function() {
      var rand = mulberry32(42);
      var ns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 1400 900');
      svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');

      var defs = document.createElementNS(ns, 'defs');

      /* Glow filter — wide bloom */
      var filter = document.createElementNS(ns, 'filter');
      filter.setAttribute('id', 'glow');
      filter.setAttribute('x', '-50%');
      filter.setAttribute('y', '-50%');
      filter.setAttribute('width', '200%');
      filter.setAttribute('height', '200%');
      var blur = document.createElementNS(ns, 'feGaussianBlur');
      blur.setAttribute('stdDeviation', '6');
      filter.appendChild(blur);
      defs.appendChild(filter);

      /* Soft bloom filter for core */
      var filter2 = document.createElementNS(ns, 'filter');
      filter2.setAttribute('id', 'core-bloom');
      filter2.setAttribute('x', '-100%');
      filter2.setAttribute('y', '-100%');
      filter2.setAttribute('width', '300%');
      filter2.setAttribute('height', '300%');
      var blur2 = document.createElementNS(ns, 'feGaussianBlur');
      blur2.setAttribute('stdDeviation', '18');
      filter2.appendChild(blur2);
      defs.appendChild(filter2);

      /* Radial gradient for central glow */
      var radGrad = document.createElementNS(ns, 'radialGradient');
      radGrad.setAttribute('id', 'center-glow');
      radGrad.setAttribute('cx', '0.6');
      radGrad.setAttribute('cy', '0.4');
      radGrad.setAttribute('r', '0.25');
      var stop1 = document.createElementNS(ns, 'stop');
      stop1.setAttribute('offset', '0%');
      stop1.setAttribute('stop-color', 'rgba(180,230,200,0.45)');
      var stop2 = document.createElementNS(ns, 'stop');
      stop2.setAttribute('offset', '40%');
      stop2.setAttribute('stop-color', 'rgba(120,200,160,0.15)');
      var stop3 = document.createElementNS(ns, 'stop');
      stop3.setAttribute('offset', '100%');
      stop3.setAttribute('stop-color', 'transparent');
      radGrad.appendChild(stop1);
      radGrad.appendChild(stop2);
      radGrad.appendChild(stop3);
      defs.appendChild(radGrad);

      svg.appendChild(defs);

      /* Bright core radial gradient */
      var coreGrad = document.createElementNS(ns, 'radialGradient');
      coreGrad.setAttribute('id', 'hot-core');
      coreGrad.setAttribute('cx', '0.5');
      coreGrad.setAttribute('cy', '0.5');
      coreGrad.setAttribute('r', '0.5');
      var cs1 = document.createElementNS(ns, 'stop');
      cs1.setAttribute('offset', '0%');
      cs1.setAttribute('stop-color', 'rgba(230,255,245,1)');
      var cs2 = document.createElementNS(ns, 'stop');
      cs2.setAttribute('offset', '25%');
      cs2.setAttribute('stop-color', 'rgba(150,220,180,0.5)');
      var cs3 = document.createElementNS(ns, 'stop');
      cs3.setAttribute('offset', '100%');
      cs3.setAttribute('stop-color', 'transparent');
      coreGrad.appendChild(cs1);
      coreGrad.appendChild(cs2);
      coreGrad.appendChild(cs3);
      defs.appendChild(coreGrad);

      /* Central ambient glow rectangle */
      var glowRect = document.createElementNS(ns, 'rect');
      glowRect.setAttribute('width', '1400');
      glowRect.setAttribute('height', '900');
      glowRect.setAttribute('fill', 'url(#center-glow)');
      svg.appendChild(glowRect);

      var mainG = document.createElementNS(ns, 'g');
      var glowG = document.createElementNS(ns, 'g');
      glowG.setAttribute('filter', 'url(#glow)');
      var coreG = document.createElementNS(ns, 'g');
      coreG.setAttribute('filter', 'url(#core-bloom)');

      var cx = 840, cy = 360;
      var pulseCount = 0;

      /* Hot core — layered circles at focal point */
      var hotCore = document.createElementNS(ns, 'circle');
      hotCore.setAttribute('cx', cx);
      hotCore.setAttribute('cy', cy);
      hotCore.setAttribute('r', '90');
      hotCore.setAttribute('fill', 'url(#hot-core)');
      coreG.appendChild(hotCore);

      /* Dense inner burst — 30 very short bright rays */
      for (var j = 0; j < 30; j++) {
        var ba = rand() * Math.PI * 2;
        var bl = 30 + rand() * 120;
        var bline = document.createElementNS(ns, 'line');
        bline.setAttribute('x1', cx);
        bline.setAttribute('y1', cy);
        bline.setAttribute('x2', Math.round(cx + bl * Math.cos(ba)));
        bline.setAttribute('y2', Math.round(cy + bl * Math.sin(ba)));
        bline.setAttribute('stroke', rand() < 0.5 ? 'rgba(180,240,210,0.7)' : 'rgba(255,255,255,0.8)');
        bline.setAttribute('stroke-width', (0.5 + rand() * 1.5).toFixed(1));
        bline.setAttribute('opacity', (0.15 + rand() * 0.35).toFixed(2));
        mainG.appendChild(bline);
        var bgl = bline.cloneNode(false);
        glowG.appendChild(bgl);
      }

      for (var i = 0; i < 120; i++) {
        /* Angle: ~270° arc, sparse at bottom-left where text lives */
        var angleDeg = -135 + rand() * 270;
        var angle = angleDeg * Math.PI / 180;
        var len = 150 + rand() * 700;

        /* Shorter rays = brighter (concentrated near core) */
        var distFactor = 1 - ((len - 150) / 700);
        var baseOpacity = 0.03 + distFactor * 0.30;
        var opacity = baseOpacity * (0.4 + rand() * 0.6);

        var sw = 0.3 + rand() * 1.5 + distFactor * 1.0;
        var isGreen = rand() < 0.4;
        var color = isGreen ? 'rgba(120,200,160,0.6)' : 'rgba(255,255,255,0.9)';

        var x2 = cx + len * Math.cos(angle);
        var y2 = cy + len * Math.sin(angle);

        var line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', cx);
        line.setAttribute('y1', cy);
        line.setAttribute('x2', Math.round(x2));
        line.setAttribute('y2', Math.round(y2));
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', sw.toFixed(1));
        line.setAttribute('opacity', opacity.toFixed(3));

        if (pulseCount < 8 && opacity > 0.12 && rand() < 0.4) {
          line.classList.add('ray-pulse');
          line.style.setProperty('--base-opacity', opacity.toFixed(3));
          line.style.setProperty('--pulse-duration', (3 + rand() * 5).toFixed(1) + 's');
          line.style.setProperty('--pulse-delay', (rand() * 3).toFixed(1) + 's');
          pulseCount++;
        }

        mainG.appendChild(line);

        /* Bright rays get glow duplicates */
        if (opacity > 0.12) {
          var gl = line.cloneNode(false);
          gl.classList.remove('ray-pulse');
          glowG.appendChild(gl);
        }

        /* Core rays (very short, bright) get extra bloom */
        if (len < 300 && opacity > 0.15) {
          var cl = line.cloneNode(false);
          cl.classList.remove('ray-pulse');
          cl.setAttribute('opacity', (opacity * 0.6).toFixed(3));
          coreG.appendChild(cl);
        }
      }

      /* Fill left-side gap (135° to 225°) with same length distribution */
      for (var k = 0; k < 40; k++) {
        var angleDeg2 = 135 + rand() * 90;
        var angle2 = angleDeg2 * Math.PI / 180;
        var len2 = 150 + rand() * 700;

        var distFactor2 = 1 - ((len2 - 150) / 700);
        var baseOpacity2 = 0.03 + distFactor2 * 0.30;
        var opacity2 = baseOpacity2 * (0.4 + rand() * 0.6);

        var sw2 = 0.3 + rand() * 1.5 + distFactor2 * 1.0;
        var isGreen2 = rand() < 0.4;
        var color2 = isGreen2 ? 'rgba(120,200,160,0.6)' : 'rgba(255,255,255,0.9)';

        var lx2 = cx + len2 * Math.cos(angle2);
        var ly2 = cy + len2 * Math.sin(angle2);

        var line2 = document.createElementNS(ns, 'line');
        line2.setAttribute('x1', cx);
        line2.setAttribute('y1', cy);
        line2.setAttribute('x2', Math.round(lx2));
        line2.setAttribute('y2', Math.round(ly2));
        line2.setAttribute('stroke', color2);
        line2.setAttribute('stroke-width', sw2.toFixed(1));
        line2.setAttribute('opacity', opacity2.toFixed(3));

        mainG.appendChild(line2);

        if (opacity2 > 0.12) {
          var gl2 = line2.cloneNode(false);
          glowG.appendChild(gl2);
        }
        if (len2 < 300 && opacity2 > 0.15) {
          var cl2 = line2.cloneNode(false);
          cl2.setAttribute('opacity', (opacity2 * 0.6).toFixed(3));
          coreG.appendChild(cl2);
        }
      }

      /* White-hot center point — rendered last (on top of all rays) */
      var whiteCore = document.createElementNS(ns, 'circle');
      whiteCore.setAttribute('cx', cx);
      whiteCore.setAttribute('cy', cy);
      whiteCore.setAttribute('r', '8');
      whiteCore.setAttribute('fill', 'rgba(255,255,255,0.85)');
      var bloomRing = document.createElementNS(ns, 'circle');
      bloomRing.setAttribute('cx', cx);
      bloomRing.setAttribute('cy', cy);
      bloomRing.setAttribute('r', '25');
      bloomRing.setAttribute('fill', 'rgba(200,245,220,0.35)');

      svg.appendChild(coreG);
      svg.appendChild(glowG);
      svg.appendChild(mainG);
      /* Top layer: bloom ring (blurred) then crisp white core */
      var topG = document.createElementNS(ns, 'g');
      topG.setAttribute('filter', 'url(#glow)');
      topG.appendChild(bloomRing);
      svg.appendChild(topG);
      svg.appendChild(whiteCore);
      document.getElementById('hero-bg').appendChild(svg);
    })();

    /* Contact: Convergence */
    (function() {
      var ns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 800 800');
      svg.setAttribute('fill', 'none');

      for (var i = 0; i < 24; i++) {
        var angle = (i * 15) * Math.PI / 180;
        var line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', '400');
        line.setAttribute('y1', '400');
        line.setAttribute('x2', Math.round(400 + 400 * Math.cos(angle)));
        line.setAttribute('y2', Math.round(400 + 400 * Math.sin(angle)));
        line.setAttribute('stroke', 'white');
        line.setAttribute('stroke-width', '0.5');
        line.setAttribute('opacity', '0.04');
        svg.appendChild(line);
      }

      document.getElementById('contact-bg').appendChild(svg);
    })();
  </script>
