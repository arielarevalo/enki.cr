[project]
name = "enki-evals"
version = "0.1.0"
description = "Evaluation bench for Enki outline agents using RAGAS + LangSmith"
requires-python = ">=3.12"
dependencies = [
    "ragas>=0.2",
    "langsmith>=0.1",
    "openai>=1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "eval: marks tests as evaluation tests (may be slow, requires LLM calls)",
]
testpaths = ["tests"]
