name: CI Agents

on:
  pull_request:
    paths:
      - "agents/**"
      - ".github/workflows/ci-agents.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agents/package-lock.json

      - run: cd agents && npm ci
      - run: cd agents && npm run type-check
      - run: cd agents && npm run test:unit
